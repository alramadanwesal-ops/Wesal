<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة لغتي – الصف الأول</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#2b2b3a;--mut:#6b6b80;--pri:#ff7a45;--ok:#2eb872;--bad:#e5484d;--line:#f0dfb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2b;--card:#2a2840;--ink:#f4f1ff;--mut:#b4b0d0;--line:#3d3a5c;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:16px}
h1{font-size:26px;text-align:center;margin:8px 0}
p.sub{text-align:center;color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.lv{display:flex;align-items:center;gap:14px;width:100%;font:inherit;color:inherit;text-align:right;cursor:pointer}
.lv:active{transform:scale(.98)}
.lv .ic{font-size:40px}.lv b{font-size:20px;display:block}.lv small{color:var(--mut)}
.lv .st{margin-inline-start:auto;font-size:18px;letter-spacing:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.btn{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.g{background:var(--line);color:var(--ink)}
.q{text-align:center}
.emo{font-size:84px;line-height:1.1}
.word.big{font-size:44px;font-weight:700;margin:6px 0}
.ask{font-size:19px;margin:8px 0 14px}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opt{min-width:84px;font:inherit;font-size:22px;font-weight:700;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:sh .3s}
.syls{display:flex;gap:8px;justify-content:center;margin:14px 0}
.syl{min-width:64px;font:inherit;font-size:34px;font-weight:700;padding:10px 14px;border:3px solid transparent;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.syl.c1{border-color:#3b82f6;background:rgba(59,130,246,.18)}
.syl.c2{border-color:var(--ok);background:rgba(46,184,114,.18)}
.syl.bad{border-color:var(--bad);animation:sh .3s}
.tools{display:flex;gap:10px;justify-content:center;margin:8px 0 12px}
.note{color:var(--mut);font-size:15px;margin:10px 0}
.sl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;min-height:60px}
.slw{min-width:72px;height:56px;padding:0 10px;border:3px dashed var(--line);border-radius:14px;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.slw.f{border-style:solid;border-color:var(--ok)}
.msg{min-height:30px;font-size:20px;font-weight:700;margin-top:12px}
.big{font-size:56px;letter-spacing:6px;margin:8px 0}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const sh=a=>[...a].sort(()=>Math.random()-.5);
const WORDS=["أَنا","إِبْراهيمَ","أَعيشُ","أَمْواجٌ","أُحِبُّ"];
const POS=["أول الكلمة","وسط الكلمة","آخر الكلمة"];
const SYL=[[["أَ",0],["نا",2]],[["إِبْ",1],["را",2],["هي",2],["مَ",0]],[["أَ",0],["عي",2],["شُ",0]],[["أَمْ",1],["وا",2],["جٌ",0]],[["أُ",0],["حِبْ",1],["بُ",0]]];
const SEN=[["أَنا","أُحِبُّ","إِبْراهيمَ"],["أَنا","أَعيشُ","في","بَيْتي"],["أَمْواجٌ","كَبيرَةٌ","في","البَحْرِ"],["أُحِبُّ","أُمّي","وَأَبي"],["أَعيشُ","مَعَ","أُسْرَتي"]];
const META=[{n:"مبتدئ",ic:"🌱",d:"أين يقع حرف (أ) في الكلمة؟"},{n:"متوسط",ic:"🌟",d:"ضع دائرة على المقطع الساكن ومقطع المد"},{n:"متقدم",ic:"🚀",d:"رتّب الكلمات لتكوين جملة مفيدة"}];
let best=[0,0,0],lvl=0,qs=[],i=0,score=0,tries=0,busy=false,mk=[],wr=[],tool=1,pos=0,msg="";
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const stars=n=>"⭐".repeat(n)+"☆".repeat(5-n);
function home(){
  $("#app").innerHTML=`<h1>🎒 لعبة لغتي</h1><p class="sub">الصف الأول – الفصل الدراسي الأول<br>اختر مستواك وابدأ اللعب</p>`+
  META.map((m,k)=>`<button class="card lv" onclick="start(${k})"><span class="ic">${m.ic}</span><span><b>${m.n}</b><small>${m.d}</small></span><span class="st">${best[k]?stars(best[k]):""}</span></button>`).join("");
}
function start(k){lvl=k;i=0;score=0;qs=sh([WORDS,SYL,SEN][k]);show()}
function head(){return `<div class="top"><button class="btn g" onclick="home()">🏠 الرئيسية</button><b>${META[lvl].ic} ${META[lvl].n} · ${i+1}/5</b><span>⭐ ${score}</span></div><div class="bar"><i style="width:${i*20}%"></i></div>`}
function show(){
  if(i>=5)return end();
  tries=0;busy=false;msg="";const q=qs[i];
  $("#app").innerHTML=head()+`<div class="card q" id="c"></div>`;
  if(lvl==0){
    $("#c").innerHTML=`<div class="word big">${q} <button class="btn g" onclick="say('${q}')">🔊</button></div><div class="ask">أين يقع حرف (أ) في هذه الكلمة؟</div><div class="opts">${POS.map((x,k)=>`<button class="opt" onclick="pick(this,${k==0})">${x}</button>`).join("")}</div><div class="msg" id="m"></div>`;
    say(q);
  }else if(lvl==1){mk=q.map(()=>0);wr=[];draw1();say(q.map(s=>s[0]).join(""))}
  else{
    pos=0;
    $("#c").innerHTML=`<div class="ask">اضغط الكلمات بالترتيب لتكوين جملة مفيدة</div><div class="sl">${q.map(()=>`<div class="slw"></div>`).join("")}</div><div class="opts">${sh(q).map(x=>`<button class="opt" onclick="tap(this,'${x}')">${x}</button>`).join("")}</div><div class="msg" id="m"></div>`;
  }
}
function draw1(){
  const q=qs[i];
  $("#c").innerHTML=`<div class="ask">ضع دائرة على المقطع الساكن 🔵 ودائرة على مقطع المد 🟢</div>
  <div class="tools"><button class="btn ${tool==1?"":"g"}" onclick="tool=1;draw1()">🔵 ساكن</button><button class="btn ${tool==2?"":"g"}" onclick="tool=2;draw1()">🟢 مد</button></div>
  <div class="syls">${q.map((s,k)=>`<button class="syl ${wr[k]?"bad":mk[k]==1?"c1":mk[k]==2?"c2":""}" onclick="mark(${k})">${s[0]}</button>`).join("")}</div>
  <div class="note">اختر نوع الدائرة ثم اضغط على المقطع. وقد لا تحتوي الكلمة على المقطعين معًا.</div>
  <button class="btn" onclick="check()">تحقق ✔</button><div class="msg" id="m">${msg}</div>`;
}
function mark(k){if(busy)return;mk[k]=mk[k]==tool?0:tool;wr=[];msg="";draw1()}
function check(){
  if(busy)return;wr=qs[i].map((s,k)=>mk[k]!=s[1]);
  if(wr.some(x=>x)){tries++;msg="راجع المقاطع ذات الإطار الأحمر 💪";draw1()}
  else{wr=[];draw1();good()}
}
function good(){
  if(tries==0)score++;
  $("#m").textContent=["أحسنت! 👏","رائع! 🎉","ممتاز! 🌟","برافو! 👍"][Math.floor(Math.random()*4)];
  busy=true;setTimeout(()=>{i++;show()},1200);
}
function pick(b,ok){
  if(busy)return;
  if(ok){b.classList.add("ok");good()}
  else{b.classList.add("bad");b.disabled=true;tries++;$("#m").textContent="حاول مرة أخرى 💪"}
}
function tap(b,x){
  if(busy)return;const w=qs[i];
  if(x===w[pos]){const s=document.querySelectorAll(".slw")[pos];s.textContent=x;s.classList.add("f");b.disabled=true;b.classList.add("ok");pos++;
    if(pos==w.length){say(w.join(" "));good()}}
  else{b.classList.add("bad");tries++;$("#m").textContent="ليست هذه الكلمة الآن، جرّب غيرها 💪";setTimeout(()=>b.classList.remove("bad"),400)}
}
function end(){
  best[lvl]=Math.max(best[lvl],score);
  const t=score==5?"بطل اللغة! 🏆":score>=3?"أداء جميل! 🎈":"استمر بالمحاولة، ستتحسن! 🌈";
  $("#app").innerHTML=`<div class="card q"><div class="emo">🎊</div><h1>${t}</h1><div class="big">${stars(score)}</div><p>حصلت على ${score} من 5</p><div class="opts"><button class="btn" onclick="start(${lvl})">🔁 العب مرة أخرى</button>${lvl<2?`<button class="btn" onclick="start(${lvl+1})">⬆️ المستوى التالي</button>`:""}<button class="btn g" onclick="home()">🏠 الرئيسية</button></div></div>`;
}
home();
</script>
</body>
</html>
